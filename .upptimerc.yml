# Upptime config - all four brands
# Docs: https://upptime.js.org/docs/configuration
#
# NOTE: `owner` must match the GitHub account/org where you create this repo.
# Change it if you push to a personal account instead of the dreamersmarkets org.
owner: dreamersmarkets
repo: status

# All checks use HEAD so monitoring costs ~zero Vercel bandwidth.
# (10 sites x ~288 checks/day = ~2,880 requests/day - with GET that would pull
# full page bodies against an already-strained Fast Data Transfer quota.)
#
# Cadence: Uptime CI is scheduled */5, but GitHub only starts it every few
# hours (median gap 3.4 h, worst 9.6 h in Oct 2026; it was ~30 min in
# August). Don't count on this repo to notice anything fast (audit PIPE-06).
sites:
  # --- Pastaphony ---
  - name: Pastaphony - website
    url: https://www.pastaphony.com
    method: HEAD
  - name: Pastaphony - API
    url: https://pastaphony-api.vercel.app
    method: HEAD

  # --- OniGuru ---
  - name: OniGuru - website
    url: https://www.onigururestaurant.com
    method: HEAD
  - name: OniGuru - API
    url: https://oniguru-api.vercel.app
    method: HEAD
  - name: OniGuru - legacy site (old.)
    url: https://old.onigururestaurant.com
    method: HEAD

  # --- Dreamers Markets ---
  - name: Dreamers Markets - website
    url: https://www.dreamersmarkets.com
    method: HEAD
  - name: Dreamers Markets - vendor intake (Wix)
    url: https://dm.dreamersmarkets.com
    method: HEAD
  - name: Dreamers Marketplace - storefront
    url: https://shop.dreamersmarkets.com
    method: HEAD
  - name: Dreamers - shop portal
    url: https://shopportal.dreamersmarkets.com
    method: HEAD
  # The cron-fleet dead-man's switch. heartbeat-check runs ON Vercel, so it
  # cannot detect its own platform failing — this GET returns 503 when any
  # operator-portal cron has gone stale (invoice reminders, Square
  # reconcile, nightly backup...). Monitoring it from GitHub Actions puts
  # the judgement outside Vercel's failure domain. Read-only and public by
  # design: it exposes cron names and staleness, no secrets, and cannot
  # trigger a cron. GET (not HEAD) because the status code depends on the
  # computed body.
  - name: Dreamers - portal cron fleet
    url: https://portal.dreamersmarkets.com/api/cron-liveness
    method: GET

  # --- Grandpa Coffee Bar ---
  - name: Grandpa Coffee Bar - website
    url: https://grandpacoffeebar.com
    method: HEAD

  # --- Square Online storefronts (added 2026-09-23, audit CRIT-01) ---
  - name: Pastaphony - Anaheim storefront
    url: https://pastaphonyanaheim.square.site
    method: HEAD
  - name: Pastaphony - Carlsbad storefront
    url: https://pastaphonycarlsbad.square.site
    method: HEAD
  - name: Pastaphony - Fullerton storefront
    url: https://pastaphonyfullerton.square.site
    method: HEAD
  - name: Pastaphony - Glendora storefront
    url: https://pastaphonyglendora.square.site
    method: HEAD
  - name: Pastaphony - Long Beach storefront
    url: https://pastaphonylongbeach.square.site
    method: HEAD
  - name: Pastaphony - Rodeo 39 storefront
    url: https://pastaphonyrodeo39.square.site
    method: HEAD
  - name: Pastaphony - Tustin storefront
    url: https://pastaphonytustin.square.site
    method: HEAD
  - name: Pastaphony - Huntington Beach storefront (coming soon)
    url: https://pastaphonyhb.square.site
    method: HEAD
  - name: OniGuru - Garden Grove storefront
    url: https://oniguru-gardengrove.square.site
    method: HEAD
  - name: OniGuru - Mission Viejo storefront
    url: https://oniguru-missionviejo.square.site
    method: HEAD
  - name: OniGuru - Ladera Ranch storefront (arcek)
    url: https://www.arcekrestaurants.com
    method: HEAD
  - name: Grandpa Coffee Bar - storefront
    url: https://grandpacoffeelb.square.site
    method: HEAD

status-website:
  # Publishes to https://<owner>.github.io/status via GitHub Pages.
  # Swap for `cname: status.dreamersmarkets.com` if you want a custom domain
  # (DNS is API-editable at Wix, so that can be automated later).
  baseUrl: /status
  name: Service status
  introTitle: "Live status for Pastaphony, OniGuru, Dreamers Markets, and Grandpa Coffee Bar."
  introMessage: Automated checks run several times a day through GitHub Actions.
  navbar:
    - title: Status
      href: /
  # Keeps the home page from jumping while it loads (audit PERF-11, CLS was
  # 0.24-0.48). The incident/maintenance blocks show a spinner, then collapse
  # to nothing or swap in "All systems operational", which shoved the monitor
  # list around. These rules hide those spinners, reserve the 58px the "All
  # systems operational" box takes, and give the monitor list a full screen
  # of room while it loads. Scoped to the home page with :has(), so the
  # history pages keep their spinners. Browsers without :has() ignore it.
  css: |
    main:has(> section.live-status) > section:not(.live-status) > .loading { display: none; }
    main:has(> section.live-status) > header + section:has(> .loading) { min-height: calc(3.5rem + 2px); }
    section.live-status:has(> .loading) { min-height: 100vh; }
    section.live-status > .loading { margin-top: 0; }
    img.icon { width: 1rem; height: 1rem; }

# Alerts: add a NOTIFICATION_DISCORD_WEBHOOK_URL repo secret (Settings -> Secrets -> Actions).
# Downtime also opens a GitHub Issue automatically even without this block.
notifications:
  - type: discord
    webhook: "$NOTIFICATION_DISCORD_WEBHOOK_URL"
